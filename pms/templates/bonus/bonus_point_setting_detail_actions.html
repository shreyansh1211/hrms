{% load i18n static %}

{% if perms.pms.change_bonuspointsetting %}
    <a
        data-toggle="oh-modal-toggle"
        data-target="#genericModal"
        hx-get="{% url 'update-bonus-point-setting' instance.id %}"
        hx-target="#genericModalBody"
        class="oh-btn oh-btn--light-bkg w-24 px-4 py-2 rounded-md text-xs flex items-center justify-center gap-2 transition duration-300"
    >
        <ion-icon name="create-outline"></ion-icon>
        {% trans "Edit" %}
    </a>
{% endif %}

{% if perms.pms.delete_bonuspointsetting %}
    <a
        hx-post="{% url 'delete-bonus-point-setting' instance.id %}"
        hx-target="#listContainer"
        hx-confirm="{% trans 'Do you want to delete the bonus point setting?' %}"
        class="w-24 px-4 py-2 bg-danger text-white rounded-md text-xs flex items-center justify-center gap-2 hover:bg-danger-dark transition duration-300"
    >
        <img
            src="{% static 'horilla_theme/assets/img/icons/trash.svg' %}"
            alt="{% trans 'Delete' %}"
            width="16"
            class="mt-[-1px] filter brightness-0 invert"
        >
        {% trans "Delete" %}
    </a>
{% endif %}
