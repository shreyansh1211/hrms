name: Build HorillaAgent Windows .exe

on:
  push:
    paths:
      - "horilla-agent/**"
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: horilla-agent
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build .exe
        working-directory: horilla-agent
        run: pyinstaller HorillaAgent.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HorillaAgent-windows
          path: horilla-agent/dist/HorillaAgent.exe
          retention-days: 30
