{% load i18n %}
{% load widget_tweaks %}
<div class="oh-dropdown__filter-body">
    <div class="oh-accordion{% if modern_filter %} oh-accordion--show{% endif %}">
        <div class="oh-accordion-header"
            onclick="event.stopImmediatePropagation();$(this).parent().toggleClass('oh-accordion--show');"
        >
            <span class="oh-filter-section-icon"><ion-icon name="build-outline"></ion-icon></span>
            {% trans "Service Request" %}
        </div>
        <div class="oh-accordion-body">
            <div class="row">
                <div class="col-sm-12 col-md-12 col-lg-12">
                    <div class="oh-input-group">
                        <label
                            class="oh-label"
                            for="{{form.requested_employee_id.id_for_label}}"
                        >{% trans "Requested By" %}</label>
                        {{ form.requested_employee_id }}
                    </div>
                </div>
                <div class="col-sm-12 col-md-12 col-lg-12">
                    <div class="oh-input-group">
                        <label
                            class="oh-label"
                            for="{{form.status.id_for_label}}"
                        >{% trans "Status" %}</label>
                        {{ form.status }}
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
