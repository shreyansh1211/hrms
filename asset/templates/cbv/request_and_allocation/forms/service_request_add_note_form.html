{% load i18n %}
<div class="oh-modal__dialog-header pb-0">
    <button
        type="button"
        class="oh-modal_close--custom"
        onclick="$('#objectCreateModal').removeClass('oh-modal--show')"
    >
        <ion-icon name="close-outline" role="img" aria-label="{% trans 'close outline' %}" class="md hydrated"></ion-icon>
    </button>
</div>
<div class="oh-modal__dialog-body">
    <h2 class="text-md font-semibold mb-3">{% trans "Add Note" %}</h2>
    <form hx-post="{% url 'asset-service-request-add-note' pk=service_request.id %}" hx-target="#objectCreateModalTarget">
        {% csrf_token %}
        <textarea
            name="note"
            rows="3"
            class="text-xs rounded-md border border-gray-200 px-2 py-1.5 w-full"
            placeholder="{% trans 'Add a note...' %}"
        ></textarea>
        <div class="flex justify-end">
            <button
                type="submit"
                class="mt-3 text-xs font-medium px-3 py-1.5 rounded-md bg-primary-600 text-white hover:bg-primary-800 transition"
            >
                {% trans "Save" %}
            </button>
        </div>
    </form>
</div>
