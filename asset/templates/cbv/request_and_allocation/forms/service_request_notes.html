{% load i18n %}
{% if notes %}
    <span class="font-medium text-xs text-[#565E6C] w-32 flex-shrink-0">
        {% trans "Notes" %} :
    </span>
    <div class="flex flex-col gap-3">
        <div class="flex flex-col gap-2 overflow-y-auto" style="max-height: 210px">
            {% for note in notes %}
            <div class="rounded-lg border border-gray-100 p-3">
                <p class="text-xs font-semibold text-gray-800">{{ note.note }}</p>
                <div class="flex items-center justify-between mt-1">
                    <span class="text-xs text-gray-600"
                        >{{ note.employee_id.get_full_name }}</span
                    >
                    <span class="text-xs text-[#666]">{{ note.created_at }}</span>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
{% endif %}
