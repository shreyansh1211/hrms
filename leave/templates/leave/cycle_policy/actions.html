{% load i18n %}
{% if perms.leave.change_leavetype or perms.leave.delete_leavetype %}
<div class="flex items-center justify-center gap-1">
    {% if perms.leave.change_leavetype %}
    <button
        class="oh-btn oh-btn--light-bkg oh-btn--sq-sm"
        title="{% trans 'Edit' %}"
        data-toggle="oh-modal-toggle"
        data-target="#objectCreateModal"
        hx-get="{% url 'leave-cycle-policy-form-update' instance.id %}"
        hx-target="#objectCreateModalTarget"
    >
        <ion-icon name="create-outline"></ion-icon>
    </button>
    {% endif %}
    {% if perms.leave.delete_leavetype %}
    <button
        onclick="event.stopPropagation()"
        class="oh-btn oh-btn--danger oh-btn--sq-sm"
        hx-confirm="{% trans 'Are you sure you want to delete this policy?' %}"
        hx-post="{% url 'leave-cycle-policy-delete' instance.id %}"
        hx-target="#cyclePolicyList"
        hx-swap="innerHTML"
        title="{% trans 'Delete' %}"
    >
        <ion-icon name="trash-outline"></ion-icon>
    </button>
    {% endif %}
</div>
{% endif %}
