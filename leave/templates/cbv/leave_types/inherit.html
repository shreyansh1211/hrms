{% load i18n %}
<div>
    {% include "generic/horilla_form.html" %}
</div>
<script>
    $("#id_is_active_parent_div").hide();

    (function () {
        var employeeFieldId = "{{ form.employee_id.id_for_label }}";
        var defaultLeaveDays = parseInt({{ default_leave_days|default:0 }}, 10) || 0;
        var leaveDaysValues = {};

        function getAvatar(id) {
            var row = $(".oh-sticky-table__tr--custom[data-instance-id='" + id + "']");
            return row.attr("data-avatar") || "";
        }

        function renderLeaveDaysTable() {
            var selected = $("#" + employeeFieldId).val() || [];
            var $container = $("#leaveDaysTableContainer");

            $container.find("input.leave-days-input").each(function () {
                leaveDaysValues[$(this).data("employee-id")] = $(this).val();
            });

            if (!selected.length) {
                $container.html("");
                return;
            }

            var rows = "";
            selected.forEach(function (id) {
                var name = $("#" + employeeFieldId + " option[value='" + id + "']").text();
                var value = leaveDaysValues[id] !== undefined ? leaveDaysValues[id] : defaultLeaveDays;
                rows +=
                    '<tr class="border-b border-[#f3f3f3]">' +
                    '<td class="text-sm text-left px-1.5 py-1.5 text-[#666]">' +
                    '<div class="oh-profile oh-profile--md w-full justify-normal">' +
                    '<div class="oh-profile__avatar mr-1" style="width:22px;height:22px;">' +
                    '<img src="' + getAvatar(id) + '" class="oh-profile__image oh-table-img avatar-thumb" width="22">' +
                    '</div>' +
                    '<span class="truncate flex-1 min-w-0">' + name + '</span>' +
                    '</div>' +
                    '</td>' +
                    '<td class="text-sm text-left px-1.5 py-1.5 text-[#666]">' +
                    '<input type="number" step="1" min="0" inputmode="numeric" pattern="[0-9]*" ' +
                    'class="oh-input leave-days-input" ' +
                    'data-employee-id="' + id + '" name="leave_days_' + id + '" value="' + value + '">' +
                    '</td>' +
                    '</tr>';
            });

            $container.html(
                '<label class="oh-label d-block mt-3 mb-2">{% trans "Leave Days"|escapejs %}</label>' +
                '<div class="bg-white p-2 rounded-md shadow-card relative">' +
                '<div class="max-h-[260px] overflow-hidden overflow-y-auto overflow-x-auto">' +
                '<table class="fixed-table w-full border-separate">' +
                '<thead class="sticky top-0 bg-[white] z-[1]">' +
                '<tr class="border-b border-[#ececec]">' +
                '<th class="text-sm font-medium text-left p-1.5">{% trans "Employee"|escapejs %}</th>' +
                '<th class="text-sm font-medium text-left p-1.5">{% trans "Leave Days"|escapejs %}</th>' +
                '</tr>' +
                '</thead>' +
                '<tbody>' + rows + '</tbody>' +
                '</table>' +
                '</div>' +
                '</div>'
            );
        }

        var $leaveDaysContainer = $("#leaveDaysTableContainer");
        if (!$leaveDaysContainer.length) {
            $leaveDaysContainer = $('<div id="leaveDaysTableContainer" class="col-12"></div>');
            $("#id_employee_id_parent_div").after($leaveDaysContainer);
        }

        $("#" + employeeFieldId).on("change", renderLeaveDaysTable);
        $leaveDaysContainer.on("input", ".leave-days-input", function () {
            var digitsOnly = $(this).val().replace(/[^0-9]/g, "");
            $(this).val(digitsOnly);
        });
        $leaveDaysContainer.on("keydown", ".leave-days-input", function (e) {
            if (e.key === "." || e.key === "-" || e.key === "e" || e.key === "+") {
                e.preventDefault();
            }
        });
        setTimeout(renderLeaveDaysTable, 300);
    })();
</script>
